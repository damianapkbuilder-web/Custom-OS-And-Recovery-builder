name: Create GitHub Release with APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.8.0)'
        required: true
        default: 'v0.8.0'
      release_name:
        description: 'Release Name'
        required: true
        default: 'Recovery & ROM Studio v0.8.0 Public Demo'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Prepare APK Release Assets
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/recovery_rom_builder_v0.8.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/app-debug.apk
          ls -la release_assets/

      - name: Create GitHub Release & Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.release_name || github.ref_name }}
          body: |
            ## 🚀 Recovery & ROM Studio - Public Demo v0.8.0
            
            ### What's New in v0.8.0:
            - **Dev Lab Suite**: Fatal crash triggers, synthetic memory leaks, shader glitch simulator, missing texture generator.
            - **ROM & Recovery Tools**: Flashable ZIP unpacker, boot.img unpacker/patcher, payload.bin Dumper, system.img repack tool.
            - **Downloadable APKs Attached Below**:
              - `recovery_rom_builder_v0.8.0.apk`
              - `app-debug.apk`
          draft: false
          prerelease: true
          files: |
            release_assets/recovery_rom_builder_v0.8.0.apk
            release_assets/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
